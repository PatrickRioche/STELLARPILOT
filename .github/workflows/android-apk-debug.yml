name: Android APK Debug

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk-debug.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk-debug.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      LOCALAPPDATA: ${{ runner.temp }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test and build simulation debug APK
        working-directory: android
        run: gradle --no-daemon :app:testSimulationDebugUnitTest :app:assembleSimulationDebug

      - name: Upload simulation APK
        uses: actions/upload-artifact@v4
        with:
          name: StellarPilot-simulation-debug
          path: ${{ runner.temp }}/StellarPilot/android-build/app/outputs/apk/simulation/debug/*.apk
          if-no-files-found: error

      - name: Build device debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDeviceDebug

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: StellarPilot-device-debug
          path: ${{ runner.temp }}/StellarPilot/android-build/app/outputs/apk/device/debug/*.apk
          if-no-files-found: error
