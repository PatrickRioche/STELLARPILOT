name: Android APK Debug

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk-debug.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk-debug.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test and build simulation debug APK
        working-directory: android
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          gradle --no-daemon :app:testSimulationDebugUnitTest :app:assembleSimulationDebug

      - name: Stage simulation APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          cp "$RUNNER_TEMP/StellarPilot/android-build/app/outputs/apk/simulation/debug/"*.apk ci-artifacts/

      - name: Upload simulation APK
        uses: actions/upload-artifact@v4
        with:
          name: StellarPilot-simulation-debug
          path: ci-artifacts/*.apk
          if-no-files-found: error

      - name: Build device debug APK
        working-directory: android
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          gradle --no-daemon :app:assembleDeviceDebug

      - name: Stage device APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts-device
          cp "$RUNNER_TEMP/StellarPilot/android-build/app/outputs/apk/device/debug/"*.apk ci-artifacts-device/

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: StellarPilot-device-debug
          path: ci-artifacts-device/*.apk
          if-no-files-found: error
