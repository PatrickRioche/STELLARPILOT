name: Server POC CI

on:
  push:
    paths:
      - "server/**"
      - "VERSION"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "VERSION"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: python -m pip install -r requirements.txt

      - name: Fetch pinned stellar catalogue sources
        working-directory: server
        run: python scripts/fetch_stellar_catalog_sources.py

      - name: Run API tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Export OpenAPI contract
        working-directory: server
        env:
          PYTHONPATH: .
        run: |
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          from app.main import app

          Path("build/openapi.json").write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: stellarpilot-openapi
          path: server/build/openapi.json

      - name: Stage Raspberry Pi server bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/stage/server
          rsync -a \
            --exclude '.venv/' \
            --exclude 'data/' \
            --exclude 'build/' \
            --exclude '.pytest_cache/' \
            --exclude '__pycache__/' \
            server/ dist/stage/server/

          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          BUILD_TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
          cat > dist/stage/server/BUILD_INFO.json <<EOF
          {
            "service": "stellarpilot-server",
            "version": "${VERSION_VALUE}",
            "build_timestamp": "${BUILD_TIMESTAMP}",
            "git_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}",
            "dirty": false
          }
          EOF

          tar -czf "dist/StellarPilot-server-${VERSION_VALUE}.tar.gz" -C dist/stage server
          sha256sum "dist/StellarPilot-server-${VERSION_VALUE}.tar.gz" > "dist/StellarPilot-server-${VERSION_VALUE}.sha256"

      - name: Upload Raspberry Pi server bundle
        uses: actions/upload-artifact@v4
        with:
          name: StellarPilot-server-v0.6.9
          path: |
            dist/StellarPilot-server-*.tar.gz
            dist/StellarPilot-server-*.sha256
          if-no-files-found: error
