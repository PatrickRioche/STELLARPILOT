name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and release notes
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          EXPECTED_TAG="v${VERSION_VALUE}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION=${VERSION_VALUE}"
            exit 2
          fi
          NOTES="docs/05-releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "${NOTES}" ]; then
            echo "Missing release notes: ${NOTES}"
            exit 3
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test server
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q

      - name: Export OpenAPI
        working-directory: server
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from app.main import app
          with open("openapi.json", "w", encoding="utf-8") as f:
              json.dump(app.openapi(), f, indent=2, ensure_ascii=False)
          PY

      - name: Package server
        run: |
          tar \
            --exclude='server/.venv' \
            --exclude='server/**/__pycache__' \
            -czf "StellarPilot-${GITHUB_REF_NAME}-server.tar.gz" \
            server/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build simulation APK
        working-directory: android
        run: gradle --no-daemon :app:testSimulationDebugUnitTest :app:assembleSimulationDebug

      - name: Build device APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDeviceDebug

      - name: Stage release assets
        shell: bash
        run: |
          cp android/app/build/outputs/apk/simulation/debug/*.apk \
            "StellarPilot-${GITHUB_REF_NAME}-simulation-debug.apk"
          cp android/app/build/outputs/apk/device/debug/*.apk \
            "StellarPilot-${GITHUB_REF_NAME}-device-debug.apk"
          cp server/openapi.json \
            "StellarPilot-${GITHUB_REF_NAME}-openapi.json"
          sha256sum \
            "StellarPilot-${GITHUB_REF_NAME}-simulation-debug.apk" \
            "StellarPilot-${GITHUB_REF_NAME}-device-debug.apk" \
            "StellarPilot-${GITHUB_REF_NAME}-server.tar.gz" \
            "StellarPilot-${GITHUB_REF_NAME}-openapi.json" \
            > "StellarPilot-${GITHUB_REF_NAME}-SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StellarPilot ${{ github.ref_name }}
          body_path: docs/05-releases/${{ github.ref_name }}.md
          prerelease: true
          files: |
            StellarPilot-${{ github.ref_name }}-simulation-debug.apk
            StellarPilot-${{ github.ref_name }}-device-debug.apk
            StellarPilot-${{ github.ref_name }}-server.tar.gz
            StellarPilot-${{ github.ref_name }}-openapi.json
            StellarPilot-${{ github.ref_name }}-SHA256SUMS.txt
